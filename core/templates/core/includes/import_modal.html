<!-- templates/core/includes/import_modal.html -->
<div id="importModal" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-none shadow-xl w-96 p-5">
        <h3 class="text-lg font-medium mb-3">Импорт данных</h3>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Выберите файл</label>
                <input type="file" id="importFile" accept=".csv,.xlsx,.json" class="w-full border border-gray-300 px-2 py-1">
            </div>
            <div class="text-xs text-gray-500">
                Поддерживаются форматы: CSV, Excel, JSON
            </div>
        </div>
        <div class="flex justify-end gap-3 mt-5">
            <button id="startImportBtn" class="px-4 py-2 bg-blue-600 text-white rounded-none text-sm">Импортировать</button>
            <button id="cancelImportBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-none text-sm">Отмена</button>
        </div>
    </div>
</div>
