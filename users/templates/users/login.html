{% extends "base_auth.html" %}
{% load static %}

{% block title %}Вход в систему{% endblock %}

{% block auth_content %}
<div class="auth-card w-full max-w-md">
    <!-- Заголовок -->
    <div class="p-6 border-b border-gray-200">
        <div class="flex items-center gap-2 text-xl font-semibold text-gray-800">
            <i class="bi bi-stack text-blue-600"></i>
            <span>LicenseFlow</span>
        </div>
        <p class="text-sm text-gray-500 mt-1">Вход в систему управления</p>
    </div>

    <!-- Форма входа -->
    <div class="p-6">
        <form method="post" action="{% url 'users:login' %}">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 text-sm mb-4">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="bi bi-envelope mr-1"></i> Имя пользователя или Email
                    </label>
                    <input type="text" name="username" id="id_username" required
                           class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                           placeholder="username или email" value="{{ form.username.value|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="bi bi-lock mr-1"></i> Пароль
                    </label>
                    <input type="password" name="password" id="id_password" required
                           class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                           placeholder="••••••••">
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 text-sm font-medium transition">
                    <i class="bi bi-box-arrow-in-right mr-2"></i>Войти
                </button>

                <div class="text-center text-sm text-gray-500">
                    Нет аккаунта?
                    <a href="{% url 'users:register' %}" class="text-blue-600 hover:underline">Зарегистрироваться</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
