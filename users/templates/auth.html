<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Учётная система</title>
    <!-- Tailwind CSS -->
    <script src="/static/js/tailwind.min.js"></script>
    <link href="/static/css/tailwind.min.css" rel="stylesheet">

    <!-- Google Fonts & Icons -->
    <link href="/static/css/css2.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        input, button { border-radius: 0 !important; }
        .auth-card {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .tab-button.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-button {
            transition: all 0.2s;
        }
        .toast-notification {
            position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 1000;
            transition: opacity 0.2s; opacity: 0; pointer-events: none;
        }
        .toast-notification.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- тост для уведомлений -->
    <div id="toast" class="toast-notification">Сообщение</div>

    <div class="auth-card w-full max-w-md">
        <!-- Заголовок с иконкой -->
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center gap-2 text-xl font-semibold text-gray-800">
                <i class="bi bi-stack text-blue-600"></i>
                <span>LicenseFlow</span>
            </div>
            <p class="text-sm text-gray-500 mt-1">Вход в систему управления</p>
        </div>

        <!-- Переключатель вкладок -->
        <div class="flex border-b border-gray-200">
            <button id="loginTab" class="tab-button active flex-1 py-3 text-sm font-medium border-r border-gray-200" data-tab="login">
                Вход
            </button>
            <button id="registerTab" class="tab-button flex-1 py-3 text-sm font-medium" data-tab="register">
                Регистрация
            </button>
        </div>

        <!-- Форма входа -->
        <div id="loginForm" class="p-6">
            <form id="loginFormElement" onsubmit="return false;">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-envelope mr-1"></i> Email
                        </label>
                        <input type="email" id="loginEmail" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="admin@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-lock mr-1"></i> Пароль
                        </label>
                        <input type="password" id="loginPassword" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="••••••••">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-sm">
                            <input type="checkbox" class="border-gray-300">
                            <span class="text-gray-600">Запомнить меня</span>
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">Забыли пароль?</a>
                    </div>
                    <button type="submit" id="loginSubmit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 text-sm font-medium transition">
                        <i class="bi bi-box-arrow-in-right mr-2"></i>Войти
                    </button>
                </div>
            </form>
        </div>

        <!-- Форма регистрации (изначально скрыта) -->
        <div id="registerForm" class="p-6 hidden">
            <form id="registerFormElement" onsubmit="return false;">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-person mr-1"></i> Имя пользователя
                        </label>
                        <input type="text" id="registerName" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="Иванов Иван">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-envelope mr-1"></i> Email
                        </label>
                        <input type="email" id="registerEmail" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="user@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-lock mr-1"></i> Пароль
                        </label>
                        <input type="password" id="registerPassword" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="минимум 6 символов">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            <i class="bi bi-lock mr-1"></i> Подтверждение пароля
                        </label>
                        <input type="password" id="registerConfirmPassword" required
                               class="w-full border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                               placeholder="введите ещё раз">
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <input type="checkbox" id="registerAgree" required class="border-gray-300">
                        <label for="registerAgree" class="text-gray-600">Я принимаю <a href="#" class="text-blue-600 hover:underline">условия использования</a></label>
                    </div>
                    <button type="submit" id="registerSubmit"
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 text-sm font-medium transition">
                        <i class="bi bi-person-plus mr-2"></i>Зарегистрироваться
                    </button>
                </div>
            </form>
        </div>

        <!-- Дополнительная информация -->
        <div class="p-6 bg-gray-50 border-t border-gray-200 text-center text-sm text-gray-500">
            <i class="bi bi-shield-check text-blue-600"></i>
            Безопасное подключение · Демо-версия
        </div>
    </div>

    <script>
        // Простая имитация работы с авторизацией
        const toast = document.getElementById('toast');

        function showToast(message, isSuccess = true) {
            toast.textContent = message;
            toast.style.background = isSuccess ? '#1e293b' : '#991b1b';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Переключение между формами
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });

        // Обработка входа
        document.getElementById('loginSubmit').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showToast('Заполните все поля', false);
                return;
            }

            if (!email.includes('@')) {
                showToast('Некорректный email', false);
                return;
            }

            if (password.length < 3) {
                showToast('Слишком короткий пароль', false);
                return;
            }

            // Имитация успешного входа
            showToast('Успешный вход! Перенаправление...', true);

            // Здесь можно добавить редирект на основную страницу
            setTimeout(() => {
                // window.location.href = 'main.html'; // раскомментировать при наличии
                showToast('Демо-режим: переход на главную', true);
            }, 1500);
        });

        // Обработка регистрации
        document.getElementById('registerSubmit').addEventListener('click', () => {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirmPassword').value;
            const agree = document.getElementById('registerAgree').checked;

            if (!name || !email || !password || !confirm) {
                showToast('Заполните все поля', false);
                return;
            }

            if (!email.includes('@')) {
                showToast('Некорректный email', false);
                return;
            }

            if (password.length < 6) {
                showToast('Пароль должен быть минимум 6 символов', false);
                return;
            }

            if (password !== confirm) {
                showToast('Пароли не совпадают', false);
                return;
            }

            if (!agree) {
                showToast('Необходимо принять условия', false);
                return;
            }

            // Имитация успешной регистрации
            showToast('Регистрация выполнена! Можете войти', true);

            // Переключаем на вкладку входа
            setTimeout(() => {
                loginTab.click();
            }, 1500);
        });

        // Дополнительно: обработка нажатия Enter
        document.getElementById('loginFormElement').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginSubmit').click();
            }
        });

        document.getElementById('registerFormElement').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('registerSubmit').click();
            }
        });
    </script>
</body>
</html>
